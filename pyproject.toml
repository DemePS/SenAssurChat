[project]
name = "senassurchat"
version = "0.2.0"
description = "SenAssurChat: an insurance assistant in Wolof, built on the WaxalAgent library (a Wolof voice agent: test page and WhatsApp)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The library: the core (waxal_agent) and the web layer (waxal_server). It brings codeagent, so the app pins nothing else.
    # While you work on both, uv reads the folder below (see [tool.uv.sources]); for a release or Docker, pin a git commit:
    #   "waxal-agent[server] @ git+https://github.com/DemePS/WaxalAgent.git@<commit>"
    "waxal-agent[server]",
]

[project.optional-dependencies]
# Oolel-Voices through Soynade's public demo Space (WAXAL_TTS=oolel-demo): only a web client, no model
demo = ["waxal-agent[demo]"]
# The agent browses the allowed websites (WAXAL_LINK_DOMAINS) in a headless browser: after installing, run `playwright install chromium`
browser = ["waxal-agent[browser]"]

[project.scripts]
senassurchat = "senassurchat.cli:main"

[dependency-groups]
dev = ["pytest>=8"]   # the library's own tests live in the WaxalAgent folder

[tool.uv.sources]
waxal-agent = { path = "../WaxalAgent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["senassurchat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
